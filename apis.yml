name: Ernesta
description: >-
  Ernesta is a direct-to-consumer, custom-sized rug company that lets homeowners
  and interior-design professionals order high-design rugs made to measure down
  to the inch. Founded by three Peloton co-founders (John Foley, Hisao Kushi, and
  Yony Feng) and backed by True Ventures, Addition, and Platform Capital, Ernesta
  sells online through a Shopify storefront and a growing set of showrooms, and
  runs a dedicated Trade Program and Trade Portal for designers. Ernesta publishes
  no public developer API; this API Evangelist profile catalogs the company's
  consumer and trade web properties plus the discovery, security, and identity
  signals observable on its public hosts.
